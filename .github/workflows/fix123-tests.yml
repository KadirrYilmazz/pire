name: Fix123 canonical tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix123-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check serverless and canonical JS syntax
        run: >-
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run Fix123 required regression tests
        run: >-
          node --test
          tests/account-honorific.test.js
          tests/canonical-ai-sync.test.js
          tests/canonical-attendance-atomic.test.js
          tests/canonical-backup.test.js
          tests/canonical-bridge-failclosed.test.js
          tests/canonical-legacy-read-compat.test.js
          tests/canonical-localstorage-guard.test.js
          tests/canonical-makeups.test.js
          tests/canonical-sync.test.js
          tests/fix123-deploy-guard.test.js
          tests/notification-canonical-state.test.js

  legacy-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full historical suite as non-blocking baseline diagnostic
        run: node --test tests/*.test.js
