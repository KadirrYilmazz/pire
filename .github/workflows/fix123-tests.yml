name: PIRE regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix123-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check serverless and canonical JS syntax
        run: >-
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install pinned DOM test environment
        run: npm ci --prefix tests/ui --ignore-scripts --no-audit --no-fund
      - name: Run complete JavaScript regression suite
        run: node --test tests/*.test.js

  atomic-registration-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned local PostgreSQL test engine
        run: npm ci --prefix tests/sql --ignore-scripts --no-audit --no-fund
      - name: Verify atomic rollback, retry and permissions in isolated PostgreSQL
        run: node --test tests/sql/*.test.cjs

  ci-required:
    if: always()
    needs: [fix123-required, atomic-registration-sql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both regression suites to pass
        env:
          JS_RESULT: ${{ needs.fix123-required.result }}
          SQL_RESULT: ${{ needs.atomic-registration-sql.result }}
        run: test "$JS_RESULT" = success && test "$SQL_RESULT" = success
