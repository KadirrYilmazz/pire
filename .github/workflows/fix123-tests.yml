name: Fix123 canonical tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix123-backend-birlestirme-faz1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node regression tests
        run: node --test tests/*.test.js
