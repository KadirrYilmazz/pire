/* Backend Alpha 2 — HTTP header Turkish-character compatibility fix. */
(function(){
  const originalSet = Headers.prototype.set;
  const originalAppend = Headers.prototype.append;
  const tr = {'Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U','ç':'c','ğ':'g','ı':'i','İ':'I','ö':'o','ş':'s','ü':'u'};
  function asciiSafe(v){
    const text=String(v);
    if (!/[^\x00-\xFF]/.test(text)) return text;
    return text.replace(/[ÇĞİÖŞÜçğıİöşü]/g,c=>tr[c]||c).normalize('NFKD').replace(/[^\x00-\xFF]/g,'');
  }
  Headers.prototype.set=function(name,value){ return originalSet.call(this,name,asciiSafe(value)); };
  Headers.prototype.append=function(name,value){ return originalAppend.call(this,name,asciiSafe(value)); };
})();

<script id="pire-new-menu-portal-fix">
/* Pİ-RE FIX 04 — Dropdown'ı stacking context dışına çıkarır. */
(function(){
  let activeDetails = null;
  let activeDropdown = null;

  function placeDropdown(details, dropdown){
    const trigger = details.querySelector('.pire-new-trigger');
    if (!trigger) return;
    const r = trigger.getBoundingClientRect();
    const width = Math.min(285, Math.max(240, window.innerWidth - 24));
    dropdown.style.position = 'fixed';
    dropdown.style.width = width + 'px';
    dropdown.style.top = Math.min(r.bottom + 10, window.innerHeight - dropdown.offsetHeight - 12) + 'px';
    let left = r.right - width;
    left = Math.max(12, Math.min(left, window.innerWidth - width - 12));
    dropdown.style.left = left + 'px';
    dropdown.style.right = 'auto';
    dropdown.style.zIndex = '2147483647';
  }

  document.addEventListener('toggle', function(e){
    const details = e.target;
    if (!(details instanceof HTMLDetailsElement) || !details.classList.contains('pire-new-menu')) return;

    const dropdown = details.querySelector('.pire-new-dropdown') ||
                     (activeDetails === details ? activeDropdown : null);

    if (details.open) {
      if (!dropdown) return;
      activeDetails = details;
      activeDropdown = dropdown;
      dropdown.dataset.pirePortal = 'true';
      document.body.appendChild(dropdown);
      requestAnimationFrame(() => placeDropdown(details, dropdown));
    } else if (activeDetails === details && activeDropdown) {
      activeDropdown.removeAttribute('style');
      activeDropdown.removeAttribute('data-pire-portal');
      details.appendChild(activeDropdown);
      activeDetails = null;
      activeDropdown = null;
    }
  }, true);

  document.addEventListener('click', function(e){
    if (!activeDetails || !activeDropdown) return;

    if (activeDropdown.contains(e.target)) {
      const btn = e.target.closest('button');
      if (btn) {
        setTimeout(() => {
          if (activeDetails) activeDetails.open = false;
        }, 0);
      }
      return;
    }

    if (!activeDetails.contains(e.target)) {
      activeDetails.open = false;
    }
  }, true);

  window.addEventListener('resize', function(){
    if (activeDetails && activeDropdown) placeDropdown(activeDetails, activeDropdown);
  });

  window.addEventListener('scroll', function(){
    if (activeDetails && activeDropdown) placeDropdown(activeDetails, activeDropdown);
  }, true);
})();
</script>

<script id="pire-global-phone-mask">
/* Pİ-RE FIX 12 — Site genelinde dinamik telefon maskesi.
   React input eventinden ÖNCE değeri biçimlendirir; sonradan açılan
   modal/form alanları dahil tüm telefon girişleri aynı davranır. */
(function(){
  const PHONE_NAMES = new Set([
    'phone','phone2','guardianphone','guardianphone2',
    'backupphone','emergencyphone','mobile','telephone','tel'
  ]);

  function isPhoneInput(el){
    if (!(el instanceof HTMLInputElement)) return false;
    const type=(el.getAttribute('type')||'').toLowerCase();
    const name=(el.getAttribute('name')||'').replace(/[-_\s]/g,'').toLowerCase();
    const id=(el.id||'').replace(/[-_\s]/g,'').toLowerCase();
    const ph=(el.getAttribute('placeholder')||'').toLowerCase();

    if (type==='tel') return true;
    if (PHONE_NAMES.has(name)) return true;
    if (name.includes('phone') || name.includes('telefon')) return true;
    if (id.includes('phone') || id.includes('telefon')) return true;
    if (ph.includes('5xx') || ph.includes('telefon')) return true;

    const label = el.closest('label')?.textContent?.toLowerCase() || '';
    return label.includes('telefon');
  }

  function digits(value){
    let d=String(value||'').replace(/\D/g,'');
    if (d.startsWith('90') && d.length>10) d=d.slice(2);
    if (d.startsWith('0')) d=d.slice(1);

    /* Türkiye mobil numarası: 5XXXXXXXXX.
       İlk rakam 5 değilse ilk hane olarak 5 kabul edilir. */
    if (d && d[0] !== '5') d='5'+d.replace(/^5+/,'');
    return d.slice(0,10);
  }

  function format(value){
    const d=digits(value);
    if(!d) return '';
    let out='0 ('+d.slice(0,3);
    if(d.length>=3) out+=')';
    if(d.length>3) out+=' '+d.slice(3,6);
    if(d.length>6) out+=' '+d.slice(6,8);
    if(d.length>8) out+=' '+d.slice(8,10);
    return out;
  }

  function prepare(el){
    if(!isPhoneInput(el)) return;
    el.setAttribute('type','tel');
    el.setAttribute('inputmode','numeric');
    el.setAttribute('autocomplete','tel');
    el.setAttribute('maxlength','17');
    el.setAttribute('placeholder','0 (5XX) XXX XX XX');

    /* Daha önce kaydedilmiş düz değerler forma geldiğinde de düzelt. */
    if(el.value && el.value !== format(el.value)){
      const nativeSetter=Object.getOwnPropertyDescriptor(
        HTMLInputElement.prototype,'value'
      )?.set;
      if(nativeSetter) nativeSetter.call(el,format(el.value));
      else el.value=format(el.value);
    }
  }

  /* Capture fazında çalışır: React onChange biçimlendirilmiş değeri görür. */
  document.addEventListener('input', function(e){
    const el=e.target;
    if(!isPhoneInput(el)) return;
    const next=format(el.value);
    if(el.value!==next){
      const setter=Object.getOwnPropertyDescriptor(
        HTMLInputElement.prototype,'value'
      )?.set;
      if(setter) setter.call(el,next);
      else el.value=next;
    }
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}
  }, true);

  document.addEventListener('focusin', function(e){
    if(isPhoneInput(e.target)) prepare(e.target);
  }, true);

  /* Dinamik açılan modal ve formları da otomatik hazırla. */
  const scan=root=>{
    if(root instanceof HTMLInputElement) prepare(root);
    root.querySelectorAll?.('input').forEach(prepare);
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>scan(document));
  }else scan(document);

  new MutationObserver(records=>{
    for(const rec of records){
      rec.addedNodes.forEach(node=>{
        if(node.nodeType===1) scan(node);
      });
    }
  }).observe(document.documentElement,{childList:true,subtree:true});

  window.PIRE_PHONE_MASK={digits,format};
})();
</script>

<script id="pire-global-iban-mask">
/* Pİ-RE FIX 13 — Site genelinde Türkiye IBAN maskesi.
   Dinamik açılan modal/form alanları dahil IBAN inputlarını otomatik algılar.
   Kullanıcı ister TR ile ister rakamla başlasın; görünüm:
   TR00 0000 0000 0000 0000 0000 00
*/
(function(){
  function isIbanInput(el){
    if (!(el instanceof HTMLInputElement)) return false;
    const name=(el.getAttribute('name')||'').replace(/[-_\s]/g,'').toLowerCase();
    const id=(el.id||'').replace(/[-_\s]/g,'').toLowerCase();
    const ph=(el.getAttribute('placeholder')||'').toLowerCase();
    const aria=(el.getAttribute('aria-label')||'').toLowerCase();
    if(name.includes('iban') || id.includes('iban') || ph.includes('iban')) return true;
    if(ph.includes('tr00') || aria.includes('iban')) return true;
    const label=el.closest('label')?.textContent?.toLowerCase() || '';
    if(label.includes('iban')) return true;
    const parentText=el.parentElement?.parentElement?.textContent?.toLowerCase() || '';
    return parentText.includes('iban') && parentText.length < 250;
  }

  function normalize(value){
    let v=String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(v.startsWith('TR')) v=v.slice(2);
    else if(v.startsWith('T')) v=v.slice(1);
    v=v.replace(/\D/g,'').slice(0,24);
    return v;
  }

  function format(value){
    const d=normalize(value);
    if(!d) return '';
    const raw='TR'+d;
    return raw.match(/.{1,4}/g).join(' ');
  }

  function prepare(el){
    if(!isIbanInput(el)) return;
    el.setAttribute('inputmode','numeric');
    el.setAttribute('autocomplete','off');
    el.setAttribute('maxlength','32');
    el.setAttribute('placeholder','TR00 0000 0000 0000 0000 0000 00');
    if(el.value){
      const next=format(el.value);
      if(el.value!==next){
        const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;
        if(setter) setter.call(el,next); else el.value=next;
      }
    }
  }

  document.addEventListener('input',function(e){
    const el=e.target;
    if(!isIbanInput(el)) return;
    const next=format(el.value);
    if(el.value!==next){
      const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;
      if(setter) setter.call(el,next); else el.value=next;
    }
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}
  },true);

  document.addEventListener('focusin',function(e){
    if(isIbanInput(e.target)) prepare(e.target);
  },true);

  document.addEventListener('paste',function(e){
    const el=e.target;
    if(!isIbanInput(el)) return;
    setTimeout(()=> {
      const next=format(el.value);
      const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;
      if(setter) setter.call(el,next); else el.value=next;
      el.dispatchEvent(new Event('input',{bubbles:true}));
    },0);
  },true);

  const scan=root=>{
    if(root instanceof HTMLInputElement) prepare(root);
    root.querySelectorAll?.('input').forEach(prepare);
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>scan(document));
  } else scan(document);

  new MutationObserver(records=>{
    records.forEach(rec=>rec.addedNodes.forEach(node=>{
      if(node.nodeType===1) scan(node);
    }));
  }).observe(document.documentElement,{childList:true,subtree:true});

  window.PIRE_IBAN_MASK={normalize,format};
})();
</script>

  /* Kullanıcılar > Yeni hesap oluştur içindeki Rol select'ine Müşteri ekle.
     Müşteri seçilince mevcut React formunu bozmadan ayrı müşteri kayıt formu açılır. */
  function enhanceAccountModal(){
    const forms=[...document.querySelectorAll('form')];
    for(const form of forms){
      const role=[...form.querySelectorAll('select')].find(s=>[...s.options].some(o=>/Eğitmen/.test(o.textContent))&&[...s.options].some(o=>/Öğrenci/.test(o.textContent)));

        const op=document.createElement('option');op.textContent='Müşteri';op.value='Müşteri';role.appendChild(op);

          const first=[...role.options].find(o=>o.value!=='Müşteri');
          if(first){role.value=first.value;role.dispatchEvent(new Event('change',{bubbles:true}))}
        }
      });

  }

  function boot(){

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);

})();
</script>

<script id="pire-fix18b-admin-account-safe">
/*
 Pİ-RE FIX 18B — Güvenli Yönetici rolü
 MutationObserver YOK.
 Ana React bundle değiştirilmez.
 Periyodik kontrol yalnızca eksik option ekler; DOM'u sürekli mutate etmez.
*/
(function(){
  function isRoleSelect(select){
    if(!(select instanceof HTMLSelectElement)) return false;
    const texts=[...select.options].map(o=>(o.textContent||'').trim());
    return texts.includes('Eğitmen') && texts.includes('Öğrenci') && texts.includes('Veli');
  }

  function ensureAdminOption(){
    document.querySelectorAll('select').forEach(select=>{
      if(!isRoleSelect(select)) return;
      if([...select.options].some(o=>(o.textContent||'').trim()==='Yönetici')) return;
      const op=document.createElement('option');
      op.value='Yönetici';
      op.textContent='Yönetici';
      select.appendChild(op);
    });
  }

  function setAdminFormState(select){
    const form=select.closest('form');
    if(!form) return;
    const admin=select.value==='Yönetici';

    const linked=form.querySelector('select[name="linked_record"]');
    const linkedLabel=linked?.closest('label');
    if(linkedLabel){
      linkedLabel.hidden=admin;
      linked.required=!admin;
      if(admin) linked.value='';
    }

    const name=form.querySelector('input[name="full_name"]');
    if(name){
      name.placeholder=admin?'Yönetici adı ve soyadı':'Ad Soyad';
      const label=name.closest('label');
      const span=label?.querySelector(':scope > span');
      if(span) span.textContent=admin?'Yönetici adı ve soyadı':'Adı ve soyadı';
    }

    const phone=form.querySelector('input[name="phone"]');
    const phoneLabel=phone?.closest('label');
    if(phone && admin){
      phone.readOnly=false;
      phone.required=true;
      phone.type='tel';
      phone.inputMode='numeric';
      phone.maxLength=17;
      phone.placeholder='0 (5XX) XXX XX XX';

      const span=phoneLabel?.querySelector(':scope > span');
      if(span) span.textContent='Yönetici giriş telefonu';

      const small=phoneLabel?.querySelector('small');
      if(small) small.textContent='Bu numara yönetici hesabının giriş telefonu olarak kullanılır.';
    }
  }

  document.addEventListener('change',function(e){
    const select=e.target;
    if(!isRoleSelect(select)) return;
    setTimeout(()=>setAdminFormState(select),0);
  },true);

  document.addEventListener('click',function(){
    /* Modal açıldıktan sonra option'ı bir kez kontrol et. */
    setTimeout(ensureAdminOption,50);
  },true);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',ensureAdminOption);
  }else{
    ensureAdminOption();
  }

  /* Sadece option eksikse DOM değiştirir. Sonsuz observer döngüsü yok. */
  setInterval(ensureAdminOption,1200);
})();
</script>


<script id="pire-fix20-admin-account-submit">
(function(){
  function digits(v){
    let d=String(v||'').replace(/\D/g,'');
    if(d.startsWith('90')&&d.length>10)d=d.slice(2);
    if(d.startsWith('0'))d=d.slice(1);
    if(d && d[0]!=='5')d='5'+d.replace(/^5+/,'');
    return d.slice(0,10);
  }
  function format(v){
    const d=digits(v); if(!d)return '';
    let o='0 ('+d.slice(0,3);
    if(d.length>=3)o+=')';
    if(d.length>3)o+=' '+d.slice(3,6);
    if(d.length>6)o+=' '+d.slice(6,8);
    if(d.length>8)o+=' '+d.slice(8,10);
    return o;
  }

  function roleSelect(form){
    return [...form.querySelectorAll('select')].find(s=>{
      const t=[...s.options].map(o=>(o.textContent||'').trim());
      return t.includes('Eğitmen')&&t.includes('Öğrenci')&&t.includes('Veli')&&t.includes('Yönetici');
    });
  }

  function apply(form){
    if(!(form instanceof HTMLFormElement))return;
    const role=roleSelect(form);
    if(!role)return;
    const admin=role.value==='Yönetici';

    const linked=form.querySelector('select[name="linked_record"]');
    const linkedLabel=linked?.closest('label');
    if(linked){
      linked.disabled=admin;
      linked.required=!admin;
      if(linkedLabel) linkedLabel.style.display=admin?'none':'';
    }

    const nativePhone=[...form.querySelectorAll('input[name="phone"]')]
      .find(x=>!x.hasAttribute('data-pire-admin-phone'));
    const nativeLabel=nativePhone?.closest('label');

    let custom=form.querySelector('[data-pire-admin-phone-wrap]');
    if(admin){
      if(nativePhone){
        nativePhone.disabled=true;
        nativePhone.required=false;
      }
      if(nativeLabel)nativeLabel.style.display='none';

      if(!custom){
        custom=document.createElement('label');
        custom.className='wide';
        custom.setAttribute('data-pire-admin-phone-wrap','1');
        custom.innerHTML=`
          <span>Yönetici giriş telefonu</span>
          <input data-pire-admin-phone name="phone" type="tel" inputmode="numeric"
                 autocomplete="tel" maxlength="17" required
                 placeholder="0 (5XX) XXX XX XX">
          <small>Bu numara yönetici hesabının giriş telefonu olarak kullanılır.</small>`;
        const nameInput=form.querySelector('input[name="full_name"]');
        const nameLabel=nameInput?.closest('label');
        if(nameLabel?.parentNode)nameLabel.parentNode.insertBefore(custom,nameLabel.nextSibling);
        else form.appendChild(custom);

        const input=custom.querySelector('[data-pire-admin-phone]');
        input.addEventListener('input',()=>{input.value=format(input.value)});
      }
      custom.style.display='grid';
      const cphone=custom.querySelector('[data-pire-admin-phone]');
      cphone.disabled=false;
      cphone.required=true;
    }else{
      if(nativePhone){
        nativePhone.disabled=false;
        nativePhone.required=true;
      }
      if(nativeLabel)nativeLabel.style.display='';
      if(custom){
        const cphone=custom.querySelector('[data-pire-admin-phone]');
        cphone.disabled=true;
        cphone.required=false;
        custom.style.display='none';
      }
    }
  }

  document.addEventListener('change',e=>{
    if(e.target instanceof HTMLSelectElement){
      const form=e.target.closest('form');
      if(form && roleSelect(form)===e.target)setTimeout(()=>apply(form),0);
    }
  },true);

  document.addEventListener('click',()=>{
    setTimeout(()=>{
      document.querySelectorAll('form').forEach(apply);
    },50);
  },true);

  document.addEventListener('submit',e=>{
    const form=e.target;
    if(!(form instanceof HTMLFormElement))return;
    const role=roleSelect(form);
    if(!role || role.value!=='Yönetici')return;

    const phone=form.querySelector('[data-pire-admin-phone]');
    if(!phone)return;
    const d=digits(phone.value);
    if(d.length!==10){
      e.preventDefault();
      e.stopImmediatePropagation();
      phone.setCustomValidity('Geçerli bir telefon numarası girin.');
      phone.reportValidity();
      setTimeout(()=>phone.setCustomValidity(''),1200);
      return;
    }
    /* FormData phone değerini normalize edilmiş 10 hane olarak okusun. */
    phone.value=d;
  },true);
})();
</script>
